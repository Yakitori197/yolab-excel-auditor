name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Production (shipped) dependencies must have no high/critical advisories.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # The full dependency tree (including dev tooling) must be advisory-free.
      # This step blocks CI on any vulnerability.
      - name: Audit (full)
        run: npm audit
